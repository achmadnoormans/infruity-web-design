<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Floating Bottom Nav Designs | Infruity (Mobile Mode)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F5C45',
                        'primary-light': '#1a7d5e',
                        'primary-dark': '#0a3d2e',
                        accent: '#F2B400',
                        'accent-light': '#f5c733',
                        cream: '#F7F7F7',
                        'cream-dark': '#EBEBEB',
                        strawberry: '#D6455D',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Poppins"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 antialiased font-sans flex flex-col items-center justify-center" x-data="{ activeDesign: 1 }">

    <!-- Desktop Warning (Visible only on large screens) -->
    <div class="fixed top-4 left-4 right-4 z-50 flex items-center justify-center pointer-events-none hidden md:flex">
        <div class="bg-gray-900 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium">
            💡 Untuk pengalaman terbaik, perkecil ukuran browser Anda hingga menyerupai layar HP (Mobile Mode).
        </div>
    </div>

    <!-- Design Selector -->
    <div class="w-full max-w-md bg-white border-b border-gray-200 px-4 py-3 flex overflow-x-auto gap-2 z-50 shadow-sm sticky top-0" style="scrollbar-width: none;">
        <button @click="activeDesign = 1" :class="activeDesign === 1 ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition">1. Glass Pill</button>
        <button @click="activeDesign = 2" :class="activeDesign === 2 ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition">2. Dark Float</button>
        <button @click="activeDesign = 3" :class="activeDesign === 3 ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition">3. Edge-to-Edge Blur</button>
        <button @click="activeDesign = 4" :class="activeDesign === 4 ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition">4. Minimalist Line</button>
        <button @click="activeDesign = 5" :class="activeDesign === 5 ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition">5. Expanded FAB</button>
    </div>

    <!-- Mobile Frame Container (Constrained width to simulate mobile if viewed on Desktop) -->
    <main class="relative w-full max-w-md h-[100dvh] md:h-[800px] md:max-h-[90vh] bg-gray-50 overflow-hidden md:rounded-[40px] md:shadow-2xl md:border-[8px] md:border-gray-900 mx-auto flex flex-col">
        
        <!-- Fake Content to show scrolling effect behind the transparent floating bar -->
        <div class="flex-1 overflow-y-auto p-5 pb-32">
            <h1 class="text-2xl font-bold text-gray-900 mb-2 font-serif">Dashboard</h1>
            <p class="text-gray-500 text-sm mb-6">Gulir ke bawah untuk melihat efek transparan dari navigasi mengambang (floating).</p>
            
            <div class="space-y-4">
                <div class="h-32 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm flex flex-col justify-between">
                    <div class="w-1/3 h-4 bg-gray-200 rounded"></div>
                    <div class="w-1/2 h-8 bg-gray-200 rounded"></div>
                </div>
                <div class="h-48 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm flex flex-col justify-between">
                    <div class="w-1/3 h-4 bg-gray-200 rounded"></div>
                    <div class="w-full h-24 bg-gray-100 rounded"></div>
                </div>
                <div class="h-32 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm flex flex-col justify-between">
                    <div class="w-1/3 h-4 bg-gray-200 rounded"></div>
                    <div class="w-1/2 h-8 bg-gray-200 rounded"></div>
                </div>
                <div class="h-48 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm flex flex-col justify-between">
                    <div class="w-1/3 h-4 bg-gray-200 rounded"></div>
                    <div class="w-full h-24 bg-gray-100 rounded"></div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- DESIGN 1: GLASS PILL (iOS STYLE)           -->
        <!-- ========================================== -->
        <div x-show="activeDesign === 1" x-transition.opacity class="absolute bottom-6 left-0 right-0 px-4 pointer-events-none z-50">
            <div class="pointer-events-auto bg-white/70 backdrop-blur-xl rounded-full border border-white/50 shadow-lg shadow-gray-200/50 p-1.5 flex items-center justify-between"
                 x-data="{ activeTab: 'pendapatan' }">
                
                <!-- Tab 1 -->
                <button @click="activeTab = 'pendapatan'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 rounded-full transition-all duration-300 relative"
                        :class="activeTab === 'pendapatan' ? 'bg-white shadow-sm' : 'hover:bg-white/40'">
                    <i class="text-xl transition-colors" 
                       :class="activeTab === 'pendapatan' ? 'ph-fill ph-wallet text-emerald-600' : 'ph ph-wallet text-gray-500'"></i>
                    <span class="text-[9px] font-semibold tracking-wide mt-1 transition-colors"
                          :class="activeTab === 'pendapatan' ? 'text-emerald-700' : 'text-gray-500'">Pendapatan</span>
                </button>
                
                <!-- Tab 2 -->
                <button @click="activeTab = 'pengeluaran'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 rounded-full transition-all duration-300 relative"
                        :class="activeTab === 'pengeluaran' ? 'bg-white shadow-sm' : 'hover:bg-white/40'">
                    <i class="text-xl transition-colors" 
                       :class="activeTab === 'pengeluaran' ? 'ph-fill ph-shopping-cart text-accent' : 'ph ph-shopping-cart text-gray-500'"></i>
                    <span class="text-[9px] font-semibold tracking-wide mt-1 transition-colors"
                          :class="activeTab === 'pengeluaran' ? 'text-yellow-700' : 'text-gray-500'">Pengeluaran</span>
                </button>
                
                <!-- Tab 3 -->
                <button @click="activeTab = 'kerugian'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 rounded-full transition-all duration-300 relative"
                        :class="activeTab === 'kerugian' ? 'bg-white shadow-sm' : 'hover:bg-white/40'">
                    <i class="text-xl transition-colors" 
                       :class="activeTab === 'kerugian' ? 'ph-fill ph-warning-circle text-strawberry' : 'ph ph-warning-circle text-gray-500'"></i>
                    <span class="text-[9px] font-semibold tracking-wide mt-1 transition-colors"
                          :class="activeTab === 'kerugian' ? 'text-red-700' : 'text-gray-500'">Kerugian</span>
                </button>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- DESIGN 2: DARK FLOAT COMMAND CENTER        -->
        <!-- ========================================== -->
        <div x-show="activeDesign === 2" x-transition.opacity class="absolute bottom-6 left-0 right-0 px-6 pointer-events-none z-50">
            <div class="pointer-events-auto bg-primary-dark/85 backdrop-blur-md rounded-2xl border border-white/10 shadow-2xl p-2 flex items-center justify-between"
                 x-data="{ activeTab: 'pendapatan' }">
                
                <!-- Glowing indicator background moving -->
                <div class="absolute top-2 bottom-2 w-[calc(33.333%-16px)] bg-white/10 rounded-xl transition-all duration-300 ease-out"
                     :style="activeTab === 'pendapatan' ? 'left: 8px;' : (activeTab === 'pengeluaran' ? 'left: calc(33.333% + 8px);' : 'left: calc(66.666% + 8px);')"></div>
                
                <!-- Tab 1 -->
                <button @click="activeTab = 'pendapatan'" 
                        class="flex-1 flex flex-col items-center justify-center py-3 relative z-10">
                    <i class="text-2xl transition-all duration-300" 
                       :class="activeTab === 'pendapatan' ? 'ph-fill ph-trend-up text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)] -translate-y-1' : 'ph ph-trend-up text-white/50'"></i>
                    <span class="text-[10px] font-medium tracking-wide mt-1 transition-all duration-300"
                          :class="activeTab === 'pendapatan' ? 'text-white opacity-100' : 'text-white/0 h-0 overflow-hidden'">Pendapatan</span>
                </button>
                
                <!-- Tab 2 -->
                <button @click="activeTab = 'pengeluaran'" 
                        class="flex-1 flex flex-col items-center justify-center py-3 relative z-10">
                    <i class="text-2xl transition-all duration-300" 
                       :class="activeTab === 'pengeluaran' ? 'ph-fill ph-shopping-bag text-accent drop-shadow-[0_0_8px_rgba(242,180,0,0.8)] -translate-y-1' : 'ph ph-shopping-bag text-white/50'"></i>
                    <span class="text-[10px] font-medium tracking-wide mt-1 transition-all duration-300"
                          :class="activeTab === 'pengeluaran' ? 'text-white opacity-100' : 'text-white/0 h-0 overflow-hidden'">Pengeluaran</span>
                </button>
                
                <!-- Tab 3 -->
                <button @click="activeTab = 'kerugian'" 
                        class="flex-1 flex flex-col items-center justify-center py-3 relative z-10">
                    <i class="text-2xl transition-all duration-300" 
                       :class="activeTab === 'kerugian' ? 'ph-fill ph-trend-down text-strawberry-light drop-shadow-[0_0_8px_rgba(224,106,126,0.8)] -translate-y-1' : 'ph ph-trend-down text-white/50'"></i>
                    <span class="text-[10px] font-medium tracking-wide mt-1 transition-all duration-300"
                          :class="activeTab === 'kerugian' ? 'text-white opacity-100' : 'text-white/0 h-0 overflow-hidden'">Kerugian</span>
                </button>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- DESIGN 3: EDGE-TO-EDGE BLUR                -->
        <!-- ========================================== -->
        <div x-show="activeDesign === 3" x-transition.opacity class="absolute bottom-0 left-0 right-0 z-50">
            <!-- Fade gradient at top of nav -->
            <div class="h-6 bg-gradient-to-t from-white/30 to-transparent pointer-events-none"></div>
            
            <div class="bg-white/80 backdrop-blur-lg border-t border-white shadow-[0_-4px_24px_-8px_rgba(0,0,0,0.1)] px-2 pb-6 pt-2 flex items-center justify-between relative"
                 x-data="{ activeTab: 'pendapatan' }">
                
                <!-- Active Indicator Line -->
                <div class="absolute top-0 h-1 bg-primary rounded-b-md transition-all duration-300 ease-out"
                     :style="activeTab === 'pendapatan' ? 'width: 33.333%; left: 0;' : (activeTab === 'pengeluaran' ? 'width: 33.333%; left: 33.333%;' : 'width: 33.333%; left: 66.666%;')"></div>
                
                <!-- Tab 1 -->
                <button @click="activeTab = 'pendapatan'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 transition-all">
                    <div class="w-12 h-8 rounded-full flex items-center justify-center transition-colors mb-1"
                         :class="activeTab === 'pendapatan' ? 'bg-emerald-50' : ''">
                         <i class="text-2xl transition-colors" 
                            :class="activeTab === 'pendapatan' ? 'ph-fill ph-wallet text-emerald-600' : 'ph ph-wallet text-gray-400'"></i>
                    </div>
                    <span class="text-[10px] font-semibold transition-colors"
                          :class="activeTab === 'pendapatan' ? 'text-gray-900' : 'text-gray-400'">Pendapatan</span>
                </button>
                
                <!-- Tab 2 -->
                <button @click="activeTab = 'pengeluaran'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 transition-all">
                    <div class="w-12 h-8 rounded-full flex items-center justify-center transition-colors mb-1"
                         :class="activeTab === 'pengeluaran' ? 'bg-orange-50' : ''">
                         <i class="text-2xl transition-colors" 
                            :class="activeTab === 'pengeluaran' ? 'ph-fill ph-shopping-cart text-accent' : 'ph ph-shopping-cart text-gray-400'"></i>
                    </div>
                    <span class="text-[10px] font-semibold transition-colors"
                          :class="activeTab === 'pengeluaran' ? 'text-gray-900' : 'text-gray-400'">Pengeluaran</span>
                </button>
                
                <!-- Tab 3 -->
                <button @click="activeTab = 'kerugian'" 
                        class="flex-1 flex flex-col items-center justify-center py-2 transition-all">
                    <div class="w-12 h-8 rounded-full flex items-center justify-center transition-colors mb-1"
                         :class="activeTab === 'kerugian' ? 'bg-red-50' : ''">
                         <i class="text-2xl transition-colors" 
                            :class="activeTab === 'kerugian' ? 'ph-fill ph-warning-circle text-strawberry' : 'ph ph-warning-circle text-gray-400'"></i>
                    </div>
                    <span class="text-[10px] font-semibold transition-colors"
                          :class="activeTab === 'kerugian' ? 'text-gray-900' : 'text-gray-400'">Kerugian</span>
                </button>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- DESIGN 4: MINIMALIST LINE (SEGMENTED)      -->
        <!-- ========================================== -->
        <div x-show="activeDesign === 4" x-transition.opacity class="absolute bottom-8 left-0 right-0 px-8 pointer-events-none z-50">
            <div class="pointer-events-auto bg-black/40 backdrop-blur-md rounded-full p-1 flex items-center justify-between"
                 x-data="{ activeTab: 'pendapatan' }">
                
                <div class="absolute bg-white rounded-full shadow-sm transition-all duration-300 ease-out z-0 top-1 bottom-1"
                     :style="activeTab === 'pendapatan' ? 'width: calc(33.333% - 5px); left: 4px;' : (activeTab === 'pengeluaran' ? 'width: calc(33.333% - 5px); left: calc(33.333% + 2px);' : 'width: calc(33.333% - 5px); left: calc(66.666% - 1px);')"></div>

                <!-- Tab 1 -->
                <button @click="activeTab = 'pendapatan'" 
                        class="flex-1 flex items-center justify-center py-2.5 relative z-10 transition-colors"
                        :class="activeTab === 'pendapatan' ? 'text-primary-dark font-bold' : 'text-white font-medium hover:text-white/80'">
                    <span class="text-[11px] tracking-wide">Pendapatan</span>
                </button>
                
                <!-- Tab 2 -->
                <button @click="activeTab = 'pengeluaran'" 
                        class="flex-1 flex items-center justify-center py-2.5 relative z-10 transition-colors"
                        :class="activeTab === 'pengeluaran' ? 'text-primary-dark font-bold' : 'text-white font-medium hover:text-white/80'">
                    <span class="text-[11px] tracking-wide">Pengeluaran</span>
                </button>
                
                <!-- Tab 3 -->
                <button @click="activeTab = 'kerugian'" 
                        class="flex-1 flex items-center justify-center py-2.5 relative z-10 transition-colors"
                        :class="activeTab === 'kerugian' ? 'text-primary-dark font-bold' : 'text-white font-medium hover:text-white/80'">
                    <span class="text-[11px] tracking-wide">Kerugian</span>
                </button>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- DESIGN 5: EXPANDED FAB (FLOATING BUTTON)   -->
        <!-- ========================================== -->
        <div x-show="activeDesign === 5" x-transition.opacity class="absolute bottom-6 right-6 pointer-events-none z-50 flex flex-col items-end"
             x-data="{ open: false, activeTab: 'pendapatan' }">
            
            <!-- Backdrop -->
            <div x-show="open" @click="open = false" x-transition.opacity class="fixed inset-0 bg-white/30 backdrop-blur-sm pointer-events-auto z-40"></div>
            
            <!-- Popup Menu -->
            <div x-show="open" 
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-4 scale-90"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 translate-y-4 scale-90"
                 class="pointer-events-auto bg-white/90 backdrop-blur-xl border border-white rounded-2xl shadow-xl shadow-gray-200 mb-4 overflow-hidden w-48 z-50 flex flex-col origin-bottom-right">
                
                <button @click="activeTab = 'pendapatan'; open = false" 
                        class="flex items-center gap-3 px-5 py-4 border-b border-gray-100 transition-colors"
                        :class="activeTab === 'pendapatan' ? 'bg-emerald-50' : 'hover:bg-gray-50'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" :class="activeTab === 'pendapatan' ? 'bg-emerald-500' : 'bg-gray-100'">
                        <i class="text-lg" :class="activeTab === 'pendapatan' ? 'ph-bold ph-wallet text-white' : 'ph ph-wallet text-gray-500'"></i>
                    </div>
                    <span class="text-sm font-semibold" :class="activeTab === 'pendapatan' ? 'text-emerald-700' : 'text-gray-700'">Pendapatan</span>
                </button>
                
                <button @click="activeTab = 'pengeluaran'; open = false" 
                        class="flex items-center gap-3 px-5 py-4 border-b border-gray-100 transition-colors"
                        :class="activeTab === 'pengeluaran' ? 'bg-orange-50' : 'hover:bg-gray-50'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" :class="activeTab === 'pengeluaran' ? 'bg-accent' : 'bg-gray-100'">
                        <i class="text-lg" :class="activeTab === 'pengeluaran' ? 'ph-bold ph-shopping-cart text-white' : 'ph ph-shopping-cart text-gray-500'"></i>
                    </div>
                    <span class="text-sm font-semibold" :class="activeTab === 'pengeluaran' ? 'text-yellow-700' : 'text-gray-700'">Pengeluaran</span>
                </button>
                
                <button @click="activeTab = 'kerugian'; open = false" 
                        class="flex items-center gap-3 px-5 py-4 transition-colors"
                        :class="activeTab === 'kerugian' ? 'bg-red-50' : 'hover:bg-gray-50'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" :class="activeTab === 'kerugian' ? 'bg-strawberry' : 'bg-gray-100'">
                        <i class="text-lg" :class="activeTab === 'kerugian' ? 'ph-bold ph-warning-circle text-white' : 'ph ph-warning-circle text-gray-500'"></i>
                    </div>
                    <span class="text-sm font-semibold" :class="activeTab === 'kerugian' ? 'text-red-700' : 'text-gray-700'">Kerugian</span>
                </button>
            </div>

            <!-- Main FAB Button -->
            <button @click="open = !open" 
                    class="pointer-events-auto bg-primary text-white w-14 h-14 rounded-full shadow-lg shadow-primary/30 flex items-center justify-center hover:bg-primary-light transition-transform duration-300 z-50 relative"
                    :class="open ? 'rotate-45' : 'hover:scale-105'">
                <!-- Show icon based on activeTab when closed, or X when open -->
                <i x-show="!open" class="text-2xl absolute" 
                   :class="activeTab === 'pendapatan' ? 'ph-bold ph-wallet' : (activeTab === 'pengeluaran' ? 'ph-bold ph-shopping-cart' : 'ph-bold ph-warning-circle')"></i>
                <i x-show="open" class="text-2xl absolute ph-bold ph-plus"></i>
            </button>
            
            <!-- Context Text Bubble -->
            <div x-show="!open" class="absolute right-16 top-1/2 -translate-y-1/2 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-100 pointer-events-none"
                 x-transition.opacity.delay.500ms>
                <span class="text-[10px] font-bold text-gray-500 whitespace-nowrap uppercase tracking-wider">Mode Aktif</span>
            </div>

        </div>

    </main>

</body>
</html>
